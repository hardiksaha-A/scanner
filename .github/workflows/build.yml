name: Build NutriShield APK
on:
  push:
    branches: [main, master]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DEBUG_KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
    steps:
      - uses: actions/checkout@v4

      - name: Unpack app and inject NutriShield index.html + logo
        run: |
          echo "Files in repository:"
          ls -la
          ZIP="$(find . -maxdepth 3 -name 'label-scanner-upload.zip' -not -path './.git/*' | head -1)"
          if [ -n "$ZIP" ]; then
            echo "Unpacking $ZIP..."
            rm -rf _unzipped
            unzip -oq "$ZIP" -d _unzipped
            PKG="$(find _unzipped -maxdepth 2 -name package.json | head -1)"
          else
            PKG="$(find . -name package.json -not -path '*/node_modules/*' -not -path './.git/*' | head -1)"
          fi
          if [ -z "$PKG" ]; then
            echo "::error::package.json not found. Keep label-scanner-upload.zip in the repo."
            exit 1
          fi
          DIR="$(dirname "$PKG")"
          echo "APP_DIR=$DIR" >> "$GITHUB_ENV"

          # 1. Inject new NutriShield index.html if present in repo root or www/
          if [ -f "index.html" ]; then
            cp -f "index.html" "$DIR/www/index.html"
            echo "Injected root index.html into $DIR/www/index.html"
          elif [ -f "www/index.html" ] && [ "$DIR" != "." ]; then
            cp -f "www/index.html" "$DIR/www/index.html"
            echo "Injected www/index.html into $DIR/www/index.html"
          fi

          # 2. Detect uploaded NutriShield logo (.png) and copy to www/logo.png
          LOGO="$(find . -maxdepth 2 \( -name 'logo.png' -o -name '1794688712297.png' -o -name '*.png' \) -not -path './_unzipped/*' -not -path './.git/*' | head -1)"
          if [ -n "$LOGO" ]; then
            cp -f "$LOGO" "$DIR/www/logo.png"
            echo "LOGO_PATH=$LOGO" >> "$GITHUB_ENV"
            echo "Copied $LOGO to $DIR/www/logo.png"
          fi

          # 3. Update appName to NutriShield in capacitor.config.json
          node -e "
            const fs = require('fs');
            const p = '$DIR/capacitor.config.json';
            const cfg = JSON.parse(fs.readFileSync(p, 'utf8'));
            cfg.appName = 'NutriShield';
            fs.writeFileSync(p, JSON.stringify(cfg, null, 2));
          "

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        working-directory: ${{ env.APP_DIR }}
        run: if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Prepare OCR files
        working-directory: ${{ env.APP_DIR }}
        run: node scripts/prep.js

      - name: Create Android project & configure NutriShield icons + Camera permissions
        working-directory: ${{ env.APP_DIR }}
        run: |
          npx cap add android

          # 1. Inject Camera, Flashlight, Internet, and Android 11+ TTS/Camera queries into AndroidManifest.xml
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          PERMS='<uses-permission android:name="android.permission.INTERNET" /><uses-permission android:name="android.permission.CAMERA" /><uses-permission android:name="android.permission.FLASHLIGHT" /><uses-feature android:name="android.hardware.camera" android:required="false" /><uses-feature android:name="android.hardware.camera.autofocus" android:required="false" /><queries><intent><action android:name="android.intent.action.TTS_SERVICE" /></intent><intent><action android:name="android.media.action.IMAGE_CAPTURE" /></intent></queries></manifest>'
          sed -i "s#</manifest>#$PERMS#" "$MANIFEST"

          # 2. Set Android App Name to NutriShield in strings.xml
          STRINGS="android/app/src/main/res/values/strings.xml"
          if [ -f "$STRINGS" ]; then
            sed -i 's#>Label Scanner<#NutriShield<#g' "$STRINGS"
          fi

          # 3. Patch MainActivity.java so Android requests runtime Camera permission on launch
          MAIN_JAVA="$(find android/app/src/main/java -name 'MainActivity.java' | head -1)"
          if [ -n "$MAIN_JAVA" ]; then
            cat << 'EOF' > "$MAIN_JAVA"
          package com.labelscanner.app;

          import android.Manifest;
          import android.content.pm.PackageManager;
          import android.os.Build;
          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                      if (checkSelfPermission(Manifest.permission.CAMERA) != PackageManager.PERMISSION_GRANTED) {
                          requestPermissions(new String[]{Manifest.permission.CAMERA}, 1001);
                      }
                  }
              }
          }
          EOF
          fi

          # 4. Generate Android Launcher Icons from www/logo.png if present
          if [ -f "www/logo.png" ]; then
            python3 - << 'PYEOF'
          import os
          from PIL import Image
          im = Image.open('www/logo.png').convert('RGBA')
          sizes = {
              'mipmap-mdpi': (48, 108),
              'mipmap-hdpi': (72, 162),
              'mipmap-xhdpi': (96, 216),
              'mipmap-xxhdpi': (144, 324),
              'mipmap-xxxhdpi': (192, 432),
          }
          res_root = 'android/app/src/main/res'
          for folder, (sz, fgsz) in sizes.items():
              d = os.path.join(res_root, folder)
              os.makedirs(d, exist_ok=True)
              im.resize((sz, sz), Image.LANCZOS).save(os.path.join(d, 'ic_launcher.png'))
              im.resize((sz, sz), Image.LANCZOS).save(os.path.join(d, 'ic_launcher_round.png'))
              fg = Image.new('RGBA', (fgsz, fgsz), (255, 255, 255, 255))
              inner = int(fgsz * 0.68)
              off = (fgsz - inner) // 2
              fg.paste(im.resize((inner, inner), Image.LANCZOS), (off, off))
              fg.save(os.path.join(d, 'ic_launcher_foreground.png'))
          bg_xml = os.path.join(res_root, 'values/ic_launcher_background.xml')
          if os.path.exists(bg_xml):
              with open(bg_xml, 'w') as f:
                  f.write('<?xml version="1.0" encoding="utf-8"?><resources><color name="ic_launcher_background">#FFFFFF</color></resources>')
          PYEOF
          fi

          npx cap sync android

      - name: Restore fixed debug signing key
        if: env.DEBUG_KEYSTORE_B64 != ''
        run: mkdir -p ~/.android && echo "$DEBUG_KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore

      - name: Build APK
        id: build
        continue-on-error: true
        working-directory: ${{ env.APP_DIR }}
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon

      - name: Retry without voice plugin if needed
        if: steps.build.outcome == 'failure'
        working-directory: ${{ env.APP_DIR }}
        run: |
          npm uninstall @capacitor-community/text-to-speech
          npx cap sync android
          cd android && ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: NutriShield-APK
          path: "${{ env.APP_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk"
