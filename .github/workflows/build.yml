name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Build
        run: |
          set -e
          ls -la
          CFG=$(find . -name capacitor.config.json -not -path '*/node_modules/*' | head -1)
          if [ -z "$CFG" ]; then echo "ERROR: capacitor.config.json not found - files were not uploaded correctly"; exit 1; fi
          cd "$(dirname "$CFG")"
          echo "APK_DIR=$PWD" >> $GITHUB_ENV
          npm install
          node scripts/prep.js
          npx cap add android
          sed -i 's#</manifest>#<uses-permission android:name="android.permission.CAMERA" /><uses-feature android:name="android.hardware.camera" android:required="false" /></manifest>#' android/app/src/main/AndroidManifest.xml
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: LabelScanner-APK
          path: ${{ env.APK_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
