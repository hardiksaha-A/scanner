name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DEBUG_KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
    steps:
      - uses: actions/checkout@v4
      - name: Find the app files and apply NutriShield updates
        run: |
          echo "Files in the repository:"; ls -la
          find_pkg() { find . -name package.json -not -path '*/node_modules/*' -not -path './.git/*' | awk '{print length($0) " " $0}' | sort -n | head -1 | cut -d' ' -f2-; }
          ZIP="$(find . -maxdepth 3 -name 'label-scanner-upload.zip' -not -path './.git/*' | head -1)"
          if [ -n "$ZIP" ]; then
            echo "Using $ZIP"; rm -rf _unzipped; unzip -oq "$ZIP" -d _unzipped
            PKG="$(find _unzipped -maxdepth 2 -name package.json | head -1)"
          else
            PKG="$(find_pkg)"
            if [ -z "$PKG" ]; then
              while IFS= read -r z; do echo "Unzipping $z"; unzip -oq "$z" -d _unzipped || true; done < <(find . -maxdepth 3 -name '*.zip' -not -path './.git/*')
              PKG="$(find_pkg)"
            fi
          fi
          if [ -z "$PKG" ]; then echo "::error::package.json not found. Upload label-scanner-upload.zip (without unzipping) to the repository."; exit 1; fi
          DIR="$(dirname "$PKG")"
          for f in capacitor.config.json www/index.html scripts/prep.js; do
            [ -f "$DIR/$f" ] || { echo "::error::Missing $f in $DIR. Upload the complete app."; exit 1; }
          done
          if [ -f "index.html" ]; then
            cp -f "index.html" "$DIR/www/index.html"
          elif [ -f "www/index.html" ] && [ "$DIR" != "." ]; then
            cp -f "www/index.html" "$DIR/www/index.html"
          fi
          LOGO="$(find . -maxdepth 2 \( -name 'logo.png' -o -name '1794688712297.png' -o -name '*.png' \) -not -path './_unzipped/*' -not -path './.git/*' | head -1)"
          if [ -n "$LOGO" ]; then
            cp -f "$LOGO" "$DIR/www/logo.png"
          fi
          sed -i 's/"Label Scanner"/"NutriShield"/g' "$DIR/capacitor.config.json"
          echo "App folder: $DIR"
          echo "APP_DIR=$DIR" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install dependencies
        working-directory: ${{ env.APP_DIR }}
        run: if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - name: Prepare OCR files
        working-directory: ${{ env.APP_DIR }}
        run: node scripts/prep.js
      - name: Create Android project
        working-directory: ${{ env.APP_DIR }}
        run: |
          npx cap add android
          sed -i 's#</manifest>#<uses-permission android:name="android.permission.INTERNET" /><uses-permission android:name="android.permission.CAMERA" /><uses-feature android:name="android.hardware.camera" android:required="false" /></manifest>#' android/app/src/main/AndroidManifest.xml
          if [ -f "android/app/src/main/res/values/strings.xml" ]; then
            sed -i 's/>Label Scanner</>NutriShield</g' android/app/src/main/res/values/strings.xml
          fi
          if [ -f "www/logo.png" ]; then
            for d in android/app/src/main/res/mipmap-*; do
              if [ -d "$d" ]; then
                if command -v convert >/dev/null 2>&1; then
                  convert "www/logo.png" -resize 192x192 "$d/ic_launcher.png" || cp -f "www/logo.png" "$d/ic_launcher.png"
                  convert "www/logo.png" -resize 192x192 "$d/ic_launcher_round.png" || cp -f "www/logo.png" "$d/ic_launcher_round.png"
                  convert "www/logo.png" -resize 324x324 "$d/ic_launcher_foreground.png" || cp -f "www/logo.png" "$d/ic_launcher_foreground.png"
                else
                  cp -f "www/logo.png" "$d/ic_launcher.png"
                  cp -f "www/logo.png" "$d/ic_launcher_round.png"
                  cp -f "www/logo.png" "$d/ic_launcher_foreground.png"
                fi
              fi
            done
          fi
          npx cap sync android
      - name: Restore fixed debug signing key
        if: env.DEBUG_KEYSTORE_B64 != ''
        run: mkdir -p ~/.android && echo "$DEBUG_KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore
      - name: Build APK
        id: build
        continue-on-error: true
        working-directory: ${{ env.APP_DIR }}
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - name: Retry without voice plugin
        if: steps.build.outcome == 'failure'
        working-directory: ${{ env.APP_DIR }}
        run: |
          npm uninstall @capacitor-community/text-to-speech
          npx cap sync android
          cd android && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: NutriShield-APK
          path: "${{ env.APP_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk"
      - name: Update Permanent APK Link
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp -f "${{ env.APP_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk" NutriShield.apk
          gh release upload latest NutriShield.apk --clobber || gh release create latest NutriShield.apk --title "NutriShield" --notes "Latest NutriShield APK"
          gh release edit latest --title "NutriShield" --notes "Download the latest NutriShield APK below." || true
