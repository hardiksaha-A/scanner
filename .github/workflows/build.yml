name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Build
        run: |
          set -e
          CFG=$(find . -name capacitor.config.json -not -path '*/node_modules/*' | head -1)
          if [ -z "$CFG" ]; then echo "ERROR: capacitor.config.json not found"; exit 1; fi
          cd "$(dirname "$CFG")"
          echo "APK_DIR=$PWD" >> $GITHUB_ENV
          cat >> www/style.css <<'CSS'
          @media(max-width:860px){

          .onb{display:block;min-height:0}
          .onb-hero{position:static!important;min-height:0!important;padding:calc(20px + env(safe-area-inset-top,0px)) 18px 20px;gap:8px}
          .onb-hero h1{font-size:26px}.onb-hero p{font-size:14px}
          .vp{display:none}
          .onb-form{padding:18px 16px 32px;max-width:none}
          .shell{display:block}
          .side{position:fixed;left:0;right:0;bottom:0;top:auto;height:auto;z-index:50;flex-direction:row;justify-content:space-around;gap:0;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));border-right:0;border-top:1px solid var(--line)}
          .side .brand,.side-foot{display:none}
          .nav{flex:1;flex-direction:column;gap:2px;font-size:11px;padding:8px 4px;justify-content:center;text-align:center;box-shadow:none!important}
          .content{padding:14px 14px calc(88px + env(safe-area-inset-bottom,0px))}
          .grid2,.grid2.eq,.scan-grid,.cols,.glance{grid-template-columns:1fr}
          .verdict .big{width:104px;height:104px;font-size:38px}
          .nutgrid{grid-template-columns:1fr 1fr}
          .card{overflow-wrap:anywhere}
          img,video,canvas{max-width:100%;height:auto}
          input,select,textarea{font-size:16px;max-width:100%}
          h1{font-size:24px}
          .scan-grid>*,.grid2>*,.cols>*,.glance>*,.row>*{min-width:0}
          .scan-box{box-sizing:border-box;max-width:100%;padding:12px}
          .card{padding:16px;box-sizing:border-box;max-width:100%}
          .row .grow{min-width:0;flex:1 1 100%}
          button{white-space:nowrap}
          .scan-box>.row>button,.scan-box>button{flex:1 1 100%}
          .row.nowrap button{flex:none}
          body::after{content:"mobile v2";position:fixed;top:2px;right:6px;font-size:10px;opacity:.55;z-index:99;pointer-events:none}
          }
          CSS
          python3 - <<'PY'
          import re
          p='www/index.html'; s=open(p).read()
          s=re.sub(r'(<meta http-equiv="Content-Security-Policy" content=")[^"]*(")', r"\1default-src 'self'; img-src 'self' data: blob:; media-src 'self' blob: mediastream:; style-src 'self' 'unsafe-inline'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; connect-src 'self' data: blob: https://world.openfoodfacts.org; font-src 'self' data:\2", s, 1)
          open(p,'w').write(s)
          PY
          npm install
          node scripts/prep.js
          npx cap add android
          sed -i 's#</manifest>#<uses-permission android:name="android.permission.CAMERA" /><uses-feature android:name="android.hardware.camera" android:required="false" /></manifest>#' android/app/src/main/AndroidManifest.xml
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Publish download link
        run: |
          cp "$APK_DIR/android/app/build/outputs/apk/debug/app-debug.apk" LabelScanner.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest LabelScanner.apk --target "${{ github.sha }}" --title "Label Scanner (latest)" --notes "Download LabelScanner.apk and install on Android."
