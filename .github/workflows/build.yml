name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Build
        run: |
          set -e
          CFG=$(find . -name capacitor.config.json -not -path '*/node_modules/*' | head -1)
          if [ -z "$CFG" ]; then echo "ERROR: capacitor.config.json not found"; exit 1; fi
          cd "$(dirname "$CFG")"
          echo "APK_DIR=$PWD" >> $GITHUB_ENV
          npm install
          node scripts/prep.js
          npx cap add android
          sed -i 's#</manifest>#<uses-permission android:name="android.permission.CAMERA" /><uses-feature android:name="android.hardware.camera" android:required="false" /></manifest>#' android/app/src/main/AndroidManifest.xml
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Publish download link
        run: |
          cp "$APK_DIR/android/app/build/outputs/apk/debug/app-debug.apk" LabelScanner.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest LabelScanner.apk --target "${{ github.sha }}" --title "Label Scanner (latest)" --notes "Download LabelScanner.apk and install it on Android."
